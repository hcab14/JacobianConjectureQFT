[project]
name = "jcqft"
version = "0.1.0"
description = "The Alpöge–Mathew counterexample to the Jacobian conjecture as a 0D quantum field theory"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.14",
    "mpmath>=1.3",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jcqft"]
